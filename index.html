<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>A Little Surprise 💗</title>

<style>

/* =========================
   BASIC PAGE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #fff9fc;
}


/* =========================
   MAIN SCREEN
========================= */

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================
   HEART BACKGROUND
========================= */

#heartBackground {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #f7b8ca;

    opacity: 0;
    transition: opacity 1.2s ease;

    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;

    z-index: 1;
}

.heart {
    position: relative;
    width: 70px;
    height: 70px;
    margin: -5px;

    color: rgba(255, 205, 218, 0.9);

    font-size: 55px;
    text-align: center;

    transform: rotate(
        var(--rotation)
    );
}


/* =========================
   OPENING SCREEN
========================= */

#openingScreen {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            #fffaff,
            #fff7fb
        );

    display: flex;
    flex-direction: column;
    align-items: center;

    z-index: 10;

    transition:
        opacity 1s ease,
        transform 1s ease;
}


/* =========================
   INSTRUCTION
========================= */

#instruction {
    margin-top: 17vh;

    text-align: center;

    font-size: clamp(38px, 10vw, 70px);
    font-weight: 900;

    color: #f18bab;

    line-height: 1.1;

    text-shadow:
        0 3px 0 #ffd4e0;

    animation: gentleBounce 2s infinite;
}

@keyframes gentleBounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================
   GIFT AREA
========================= */

#giftArea {
    position: absolute;

    width: 82vw;
    max-width: 430px;

    height: 330px;

    bottom: 13vh;

    left: 50%;

    transform: translateX(-50%);

    cursor: pointer;
}


/* =========================
   GIFT BOX
========================= */

#giftBox {
    position: absolute;

    width: 75%;
    height: 52%;

    left: 12.5%;
    bottom: 0;

    background: linear-gradient(
        135deg,
        #d9c2fa,
        #caa9f1
    );

    border: 5px solid #a987dc;

    border-radius: 18px 18px 28px 28px;

    box-shadow:
        0 14px 0 rgba(150, 110, 190, 0.15);

    transition:
        transform 1s ease;
}


/* box front ribbon */

#boxRibbon {
    position: absolute;

    width: 22%;
    height: 100%;

    left: 39%;

    background: #ff9fba;
}


/* =========================
   GIFT LID
========================= */

#giftLid {
    position: absolute;

    width: 85%;
    height: 25%;

    left: 7.5%;
    bottom: 48%;

    background: linear-gradient(
        135deg,
        #e1cafa,
        #ceb1f2
    );

    border: 5px solid #a987dc;

    border-radius: 18px;

    z-index: 5;

    transition:
        transform 1.1s cubic-bezier(.2,.8,.2,1),
        opacity 0.5s ease;
}


/* lid ribbon */

#lidRibbon {
    position: absolute;

    width: 22%;
    height: 100%;

    left: 39%;

    background: #ff9fba;
}


/* =========================
   BOW
========================= */

#bow {
    position: absolute;

    width: 230px;
    height: 110px;

    left: 50%;
    bottom: 65%;

    transform: translateX(-50%);

    z-index: 8;

    transition:
        transform 1s ease;
}

.bowLeft,
.bowRight {

    position: absolute;

    width: 105px;
    height: 75px;

    top: 5px;

    background: #ffabc1;

    border: 5px solid #f38da9;

    border-radius:
        70% 25% 70% 25%;

}

.bowLeft {
    left: 0;

    transform:
        rotate(-15deg);
}

.bowRight {
    right: 0;

    transform:
        scaleX(-1)
        rotate(-15deg);
}

.bowCenter {

    position: absolute;

    width: 55px;
    height: 65px;

    left: 50%;
    top: 18px;

    transform: translateX(-50%);

    background: #ffabc1;

    border: 5px solid #f38da9;

    border-radius: 30px;

    z-index: 3;
}


/* =========================
   CUTE CHARACTER
========================= */

#character {

    position: absolute;

    width: 125px;
    height: 105px;

    left: 50%;
    bottom: 13%;

    transform: translateX(-50%);

    background: #fffdfc;

    border: 5px solid #604f43;

    border-radius:
        45% 45% 48% 48%;

    z-index: 3;
}


/* ears */

#character::before,
#character::after {

    content: "";

    position: absolute;

    width: 38px;
    height: 38px;

    background: #5c5046;

    border-radius: 50%;

    top: -13px;

    z-index: -1;
}

#character::before {
    left: 2px;
}

#character::after {
    right: 2px;
}


/* eyes */

.eye {

    position: absolute;

    width: 25px;
    height: 30px;

    background: #4b4038;

    border-radius: 50%;

    top: 38px;
}

.eye::after {

    content: "";

    position: absolute;

    width: 9px;
    height: 9px;

    background: white;

    border-radius: 50%;

    top: 5px;
    left: 6px;
}

.eye.left {
    left: 27px;
}

.eye.right {
    right: 27px;
}


/* mouth */

.mouth {

    position: absolute;

    width: 18px;
    height: 10px;

    left: 50%;
    top: 69px;

    transform: translateX(-50%);

    border-bottom: 4px solid #4b4038;

    border-radius: 50%;
}


/* blush */

.blush {

    position: absolute;

    width: 23px;
    height: 13px;

    background: #ffccd5;

    border-radius: 50%;

    top: 68px;
}

.blush.left {
    left: 12px;
}

.blush.right {
    right: 12px;
}


/* little bow on character */

.characterBow {

    position: absolute;

    width: 70px;
    height: 30px;

    left: 50%;
    top: -28px;

    transform: translateX(-50%);
}

.characterBow::before,
.characterBow::after {

    content: "";

    position: absolute;

    width: 40px;
    height: 27px;

    background: #c9b8e7;

    border: 3px solid #a796c6;

    border-radius: 50%;
}

.characterBow::before {
    left: 0;
}

.characterBow::after {
    right: 0;
}

.characterBow span {

    position: absolute;

    width: 20px;
    height: 24px;

    background: #c9b8e7;

    border: 3px solid #a796c6;

    border-radius: 50%;

    left: 25px;

    z-index: 2;
}


/* =========================
   PARTICLES
========================= */

.particle {

    position: absolute;

    pointer-events: none;

    z-index: 30;

    font-size: 30px;

    animation:
        explode 2s ease-out forwards;
}

@keyframes explode {

    0% {
        opacity: 1;
        transform:
            translate(0,0)
            scale(.4)
            rotate(0deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(
                var(--scale)
            )
            rotate(
                var(--rotate)
            );
    }
}


/* =========================
   LYRIC SCREEN
========================= */

#lyricsScreen {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;
}


/* lyric */

#lyric {

    width: 92%;

    text-align: center;

    color: #ef5f9d;

    font-size: clamp(
        48px,
        13vw,
        95px
    );

    font-weight: 900;

    line-height: 1;

    letter-spacing: -2px;

    -webkit-text-stroke:
        7px white;

    paint-order: stroke fill;

    text-shadow:
        0 7px 0 rgba(
            190,
            65,
            125,
            .12
        );

    opacity: 0;

    transform:
        scale(.5)
        rotate(-4deg);

    transition:
        opacity .3s ease,
        transform .5s cubic-bezier(.2,1.4,.4,1);
}

#lyric.show {

    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);
}


/* =========================
   PLAY BUTTON
========================= */

#playButton {

    position: absolute;

    left: 50%;
    bottom: 8%;

    transform: translateX(-50%);

    z-index: 100;

    display: none;

    padding: 15px 30px;

    border: none;

    border-radius: 50px;

    background: #f0649d;

    color: white;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 8px 20px rgba(
            200,
            80,
            130,
            .3
        );
}


/* =========================
   FINAL MESSAGE
========================= */

#finalMessage {

    position: absolute;

    left: 50%;
    bottom: 8%;

    transform:
        translateX(-50%)
        scale(.5);

    width: 90%;

    text-align: center;

    color: #ef5f9d;

    font-size: 28px;

    font-weight: bold;

    opacity: 0;

    transition: all 1s ease;

    z-index: 25;
}

#finalMessage.show {

    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    #instruction {
        margin-top: 18vh;
        font-size: 45px;
    }

    #giftArea {
        bottom: 12vh;
        height: 300px;
    }

    #lyric {
        font-size: 14vw;

        -webkit-text-stroke:
            5px white;
    }
}

</style>
</head>


<body>

<div id="app">


    <!-- =========================
         HEART BACKGROUND
    ========================== -->

    <div id="heartBackground"></div>


    <!-- =========================
         OPENING SCREEN
    ========================== -->

    <div id="openingScreen">

        <div id="instruction">
            Double tap<br>
            to Open
        </div>


        <div id="giftArea">

            <!-- Gift lid -->

            <div id="giftLid">

                <div id="lidRibbon"></div>

            </div>


            <!-- Bow -->

            <div id="bow">

                <div class="bowLeft"></div>
                <div class="bowRight"></div>

                <div class="bowCenter"></div>

            </div>


            <!-- Gift box -->

            <div id="giftBox">

                <div id="boxRibbon"></div>


                <!-- Cute character -->

                <div id="character">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="blush left"></div>
                    <div class="blush right"></div>

                    <div class="mouth"></div>


                    <div class="characterBow">
                        <span></span>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         LYRICS
    ========================== -->

    <div id="lyricsScreen">

        <div id="lyric"></div>

    </div>


    <!-- =========================
         FINAL MESSAGE
    ========================== -->

    <div id="finalMessage">
        Made just for you 💗
    </div>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="music"
        preload="auto"
        playsinline>

        <source
            src="https://raw.githubusercontent.com/yuzeemirin/tutu/main/cswfR85D7jM-2e69122c32fdc08dd1f790ada0781604841.mp3"
            type="audio/mpeg">

    </audio>


    <!-- PLAY FALLBACK -->

    <button id="playButton">
        💗 Tap to Play
    </button>


</div>



<script>

/* =====================================================
   SETTINGS
===================================================== */


/*
   IMPORTANT:

   The song should start at 47 seconds.

   47 seconds = 0:47
*/

const MUSIC_START_TIME = 47;


/* =====================================================
   YOUR LYRICS
=====================================================

   Put your lyrics here.

   "time" = when the lyric should appear.

   Example:

   {
       time: 47,
       text: "Your first lyric"
   }

   means:

   At exactly 0:47 the lyric appears.

===================================================== */


const lyrics = [

    /*
    {
        time: 47,
        text: "YOUR FIRST LYRIC"
    },

    {
        time: 51,
        text: "YOUR SECOND LYRIC"
    },

    {
        time: 55,
        text: "YOUR THIRD LYRIC"
    },

    {
        time: 59,
        text: "YOUR FOURTH LYRIC"
    }
    */

];


/* =====================================================
   ELEMENTS
===================================================== */

const openingScreen =
    document.getElementById("openingScreen");

const giftArea =
    document.getElementById("giftArea");

const giftLid =
    document.getElementById("giftLid");

const bow =
    document.getElementById("bow");

const heartBackground =
    document.getElementById("heartBackground");

const music =
    document.getElementById("music");

const lyric =
    document.getElementById("lyric");

const playButton =
    document.getElementById("playButton");

const finalMessage =
    document.getElementById("finalMessage");


/* =====================================================
   CREATE HEART BACKGROUND
===================================================== */

function createHeartBackground() {

    heartBackground.innerHTML = "";

    const totalHearts = 110;

    for (
        let i = 0;
        i < totalHearts;
        i++
    ) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "♡";

        heart.style.setProperty(
            "--rotation",
            `${Math.random() * 30 - 15}deg`
        );

        heart.style.fontSize =
            `${35 + Math.random() * 45}px`;

        heart.style.opacity =
            `${0.45 + Math.random() * .5}`;

        heart.style.transform =
            `rotate(${Math.random() * 30 - 15}deg)`;

        heartBackground.appendChild(
            heart
        );
    }
}


/* =====================================================
   HEART EXPLOSION
===================================================== */

function createExplosion() {

    const symbols = [
        "💗",
        "💕",
        "💖",
        "💞",
        "🌸",
        "🎀",
        "✨",
        "♡"
    ];


    for (
        let i = 0;
        i < 55;
        i++
    ) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.innerText =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        /* Start from center */

        particle.style.left =
            "50%";

        particle.style.top =
            "58%";


        /* Random direction */

        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            180 +
            Math.random() *
            450;


        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance;


        particle.style.setProperty(
            "--x",
            `${x}px`
        );

        particle.style.setProperty(
            "--y",
            `${y}px`
        );


        particle.style.setProperty(
            "--scale",
            `${0.7 + Math.random() * 1.5}`
        );

        particle.style.setProperty(
            "--rotate",
            `${Math.random() * 720 - 360}deg`
        );


        particle.style.animationDelay =
            `${Math.random() * .3}s`;


        document.body.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 2500);

    }
}


/* =====================================================
   OPEN GIFT
===================================================== */

let opened = false;

function openGift() {

    if (opened) return;

    opened = true;


    /* Stop instruction */

    document.getElementById(
        "instruction"
    ).style.opacity = "0";


    /* Lift lid */

    giftLid.style.transform =
        "translateY(-170px) rotate(-7deg)";


    /* Move bow */

    bow.style.transform =
        "translateX(-50%) translateY(-150px) rotate(-7deg)";


    /* Explosion */

    setTimeout(() => {

        createExplosion();

    }, 300);


    /* Show heart background */

    setTimeout(() => {

        heartBackground.style.opacity = "1";

    }, 650);


    /* Fade gift away */

    setTimeout(() => {

        openingScreen.style.opacity = "0";

        openingScreen.style.transform =
            "scale(1.08)";

    }, 1300);


    /* Start music */

    setTimeout(() => {

        startMusic();

    }, 900);

}


/* =====================================================
   DOUBLE TAP
===================================================== */

let lastTap = 0;


giftArea.addEventListener(
    "pointerup",
    function() {

        const now =
            Date.now();

        const difference =
            now - lastTap;


        if (
            difference > 0 &&
            difference < 450
        ) {

            openGift();

        }


        lastTap = now;

    }
);


/* =====================================================
   ALSO OPEN WITH DOUBLE CLICK
===================================================== */

giftArea.addEventListener(
    "dblclick",
    function() {

        openGift();

    }
);


/* =====================================================
   START MUSIC AT 0:47
===================================================== */

async function startMusic() {

    try {

        /*
           Jump directly to 47 seconds.
        */

        music.currentTime =
            MUSIC_START_TIME;


        await music.play();


        playButton.style.display =
            "none";


    } catch (error) {

        /*
           Some mobile browsers block
           automatic audio.

           Show a button instead.
        */

        playButton.style.display =
            "block";

    }

}


/* =====================================================
   PLAY BUTTON
===================================================== */

playButton.addEventListener(
    "click",
    async function() {

        try {

            music.currentTime =
                MUSIC_START_TIME;

            await music.play();

            playButton.style.display =
                "none";

        } catch (error) {

            alert(
                "Please tap the button again 💗"
            );

        }

    }
);


/* =====================================================
   LYRIC SYSTEM
===================================================== */

let currentLyricIndex = -1;


function showLyric(text) {

    /*
       Hide old lyric
    */

    lyric.classList.remove("show");


    setTimeout(() => {

        lyric.innerText = text;

        lyric.classList.add("show");

    }, 200);

}


/* =====================================================
   CHECK SONG TIME
===================================================== */

music.addEventListener(
    "timeupdate",
    function() {

        if (
            lyrics.length === 0
        ) {
            return;
        }


        let newIndex = -1;


        /*
           Find the latest lyric
           that should already be visible.
        */

        for (
            let i = 0;
            i < lyrics.length;
            i++
        ) {

            if (
                music.currentTime >=
                lyrics[i].time
            ) {

                newIndex = i;

            }

        }


        /*
           New lyric found
        */

        if (
            newIndex !==
            currentLyricIndex
        ) {

            currentLyricIndex =
                newIndex;


            if (
                newIndex >= 0
            ) {

                showLyric(
                    lyrics[newIndex].text
                );

            }

        }

    }
);


/* =====================================================
   SONG ENDED
===================================================== */

music.addEventListener(
    "ended",
    function() {

        lyric.classList.remove(
            "show"
        );


        setTimeout(() => {

            finalMessage.classList.add(
                "show"
            );

        }, 500);

    }
);


/* =====================================================
   PREPARE HEARTS
===================================================== */

createHeartBackground();

</script>

</body>
</html>
